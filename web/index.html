<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toponymia</title>
    <!--seo-->
    <script>
      // Runs before the bundle and before first paint, so a returning
      // dark-mode reader never sees a white flash. Light is the default:
      // only an explicit stored choice turns this on. Kept in sync with
      // src/theme.ts, which owns the same key.
      try {
        if (localStorage.getItem('toponymia:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {
        /* private mode with storage disabled: stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
