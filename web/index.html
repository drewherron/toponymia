<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toponymia</title>
    <!--seo-->
    <script>
      // Runs before the bundle and before first paint, so a dark-mode
      // reader never sees a white flash. A stored choice wins; with none,
      // follow the OS. Kept in sync with initialTheme() in src/theme.ts,
      // which makes the same decision once the bundle parses.
      try {
        var stored = null
        try {
          stored = localStorage.getItem('toponymia:theme')
        } catch (e) {
          /* private mode with storage disabled: fall through to the OS */
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch (e) {
        /* no matchMedia either: stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
